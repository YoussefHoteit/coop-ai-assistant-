<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a73226">
  <meta name="description" content="Al Makhazen storefront demo with an in-store shopping assistant.">
  <title>Al Makhazen · Storefront Demo</title>
  <link rel="stylesheet" href="/store.css">
  <script type="module" src="/store.js"></script>
  <script defer src="/widget.js"></script>
</head>
<body>
  <header class="store-header">
    <div class="top-row">
      <span class="header-icon" aria-hidden="true">☰</span>
      <div class="store-brand"><strong lang="ar">المخازن</strong><small>AL MAKHAZEN</small></div>
      <div class="order-location"><span>ORDERING FROM</span><strong id="branch-name">Beirut</strong><i aria-hidden="true">▾</i></div>
      <button class="basket-button" id="store-basket" aria-label="Open shopping list" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 2 9h14l2-9ZM7 10l5-6 5 6M10 13v3m4-3v3"/></svg><div class="basket-label"><b>My list</b><small id="basket-total">$0.00</small></div><span id="basket-count">0</span></button>
    </div>
    <div class="search-row" aria-hidden="true">
      <span>search items</span>
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15 15 6 6"/></svg>
    </div>
  </header>

  <main>
    <section class="produce-promo" aria-label="Fresh produce promotion">
      <div class="promo-copy" dir="rtl" lang="ar">
        <p>خضار وفاكهة طازجة</p>
        <h1>من البستان<br>للميزان</h1>
        <span class="promo-label">تسوّق الخضار والفواكه <span aria-hidden="true">←</span></span>
      </div>
    </section>
    <section class="departments" id="departments" aria-labelledby="departments-title">
      <h2 class="sr-only" id="departments-title">Store departments</h2>
      <div class="category-grid" id="category-grid"></div>
    </section>
  </main>
  <footer class="store-footer">
    <span>Al Makhazen storefront demo</span>
  </footer>
  <dialog id="store-dialog" aria-labelledby="store-dialog-title">
    <header class="store-dialog-header"><h2 id="store-dialog-title">Your shopping list</h2><button class="outline" id="close-store-dialog" aria-label="Close" type="button">×</button></header>
    <div id="store-dialog-content"></div>
  </dialog>
</body>
</html>
